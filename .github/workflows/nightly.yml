name: Update GitHub Profile README

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate profile SVGs and README
        run: python scripts/build.py

      - name: Commit updated assets and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ scripts/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh nightly profile stats and SVGs"
            git push
          fi

